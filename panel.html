<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de cursos de verano · Universidad Continental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--m:#6A00BE;--mo:#4B0087;--n:#120C1C;--n2:#1E1530;--a:#F2A900;--l:#F3ECFB;--lf:#F6F2FA;--t:#15111C;--s:#575163;--b:#E5E2EB;--ok:#145C34;--okb:#E3F2EA;--av:#6B4200;--avb:#FFF3D6;--er:#7A2419;--erb:#FDE9E7;--fondo:#F7F5FA}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;color:var(--t);background:var(--fondo)}
h1,h2,h3{font-family:Sora,sans-serif;margin:0}
a{color:var(--m)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px;box-shadow:0 0 0 2px var(--n);border-radius:6px}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.demo{background:var(--l);color:var(--mo);font-size:13.5px;padding:8px 16px;text-align:center}
.demo b.tag{background:var(--mo);color:#fff;padding:2px 8px;border-radius:999px;font-size:12px;margin-right:6px}
/* Estructura */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:calc(100vh - 38px)}
.lateral{background:var(--n);color:#fff;display:flex;flex-direction:column;gap:18px;padding:22px 16px;position:sticky;top:0;height:100vh}
.lateral .logo img{height:36px;filter:brightness(0) invert(1)}
.lateral .producto{font:700 15px Sora,sans-serif;color:#fff;margin-top:6px}
.lateral .producto small{display:block;font:500 12.5px 'DM Sans',sans-serif;color:#D9C2F0}
.navlat{display:flex;flex-direction:column;gap:4px}
.navlat button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:0;border-radius:12px;background:none;color:#E9E1F3;cursor:pointer;font-weight:500;text-align:left}
.navlat button:hover{background:rgba(255,255,255,.08)}
.navlat button[aria-current="page"]{background:var(--m);color:#fff;font-weight:700}
.navlat svg{width:20px;height:20px;flex:none}
.fase-lat{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;font-size:13px;color:#D9C2F0}
.fase-lat b{display:block;color:var(--a);font-size:14px}
.usuario-lat{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;font-size:14px}
.usuario-lat .rol{display:inline-block;margin-top:4px}
.usuario-lat button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:8px 0;min-height:44px;font-weight:700}
.contenido{min-width:0;display:flex;flex-direction:column}
.barra-sup{position:sticky;top:0;z-index:20;background:rgba(247,245,250,.96);backdrop-filter:blur(6px);border-bottom:1px solid #ECE6F3;padding:14px 28px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.barra-sup h1{font-size:22px}
.barra-sup .sub{font-size:13.5px;color:var(--s)}
.filtros-glob{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;min-width:0}
.filtros-glob label.campo{min-width:0}
.filtros-glob select{width:100%;max-width:300px}
main{padding:24px 28px 64px;min-width:0}
/* Componentes */
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--m);background:var(--m);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--mo);border-color:var(--mo)}
.btn.sec{background:#fff;color:var(--mo)} .btn.sec:hover{background:var(--l)}
.btn.chico{min-height:38px;padding:0 13px;font-size:13.5px}
.btn.wa{background:#1B7A43;border-color:#1B7A43}.btn.wa:hover{background:#145C34;border-color:#145C34}
.btn-texto{background:none;border:0;color:var(--mo);font-weight:700;cursor:pointer;text-decoration:underline;min-height:40px;padding:0 6px}
.icono-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--b);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mo)}
.icono-btn:hover{background:var(--l);border-color:var(--m)}
.icono-btn.wa{color:#1B7A43}
.icono-btn svg{width:18px;height:18px}
.tarjeta{background:#fff;border:1px solid var(--b);border-radius:18px;padding:20px}
.tarjeta h2{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tarjeta h2 small{font:500 13px 'DM Sans',sans-serif;color:var(--s)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{position:relative;overflow:hidden}
.kpi small{display:block;color:var(--s);font-size:13.5px}
.kpi b{font:400 42px/1 'Bebas Neue',sans-serif;color:var(--m)}
.kpi .det{font-size:12.5px;color:var(--s)}
.kpi.acento{background:var(--n);border-color:var(--n)} .kpi.acento small,.kpi.acento .det{color:#D9C2F0} .kpi.acento b{color:var(--a)}
.dos{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.barras{display:flex;flex-direction:column;gap:8px}
.barra{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) 40px;gap:12px;align-items:center;font-size:14px;width:100%;background:none;border:0;padding:4px 6px;border-radius:8px;text-align:left;color:var(--t)}
button.barra{cursor:pointer} button.barra:hover{background:var(--lf)}
.barra span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra b{text-align:right}
.pista{height:12px;border-radius:99px;background:var(--lf);position:relative;overflow:visible}
.pista i{display:block;height:100%;border-radius:99px;background:var(--m)}
.pista .min{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--n)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okb);color:var(--ok)} .p-av{background:var(--avb);color:var(--av)} .p-er{background:var(--erb);color:var(--er)} .p-gr{background:#F1EDF5;color:#3E3850} .p-m{background:var(--l);color:var(--mo)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid #D9C2F0;background:#fff;color:var(--mo);font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip span{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--l);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.chip[aria-pressed="true"]{background:var(--m);border-color:var(--m);color:#fff}
.chip[aria-pressed="true"] span{background:rgba(255,255,255,.2);color:#fff}
.herramientas{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:#3E3850}
input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{min-height:40px;border:1px solid #BDB4CB;border-radius:10px;padding:6px 10px;background:#fff;color:var(--t);max-width:100%}
input[type=number]{width:82px}
input[type=search]{min-width:240px}
textarea{width:100%;min-height:70px}
.tabla-scroll{overflow-x:auto;border:1px solid var(--b);border-radius:16px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:#FBFAFD;color:#3E3850;text-align:left;padding:11px 12px;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--b);position:sticky;top:0}
td{padding:11px 12px;border-top:1px solid #F0EDF4;vertical-align:top}
tbody tr:hover{background:#FCFBFE}
tr.sel{background:#F7F1FD!important}
.meta{font-size:13px;color:var(--s)}
.nombre{font-weight:700}
.acciones{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.masivo{position:sticky;top:76px;z-index:15;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--n);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px}
.masivo select{min-height:38px}
.masivo .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)} .masivo .btn.sec:hover{background:rgba(255,255,255,.1)}
.paginacion{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:14px}
.paginas{display:flex;gap:4px;flex-wrap:wrap}
.paginas button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--b);background:#fff;cursor:pointer;font-weight:700;color:var(--mo)}
.paginas button[aria-current="page"]{background:var(--m);color:#fff;border-color:var(--m)}
.paginas button:disabled{opacity:.4;cursor:default}
.mini{height:6px;border-radius:99px;background:var(--lf);margin-top:6px;position:relative;width:130px}
.mini i{display:block;height:100%;border-radius:99px}
/* Ficha y modal */
.cortina{position:fixed;inset:0;background:rgba(18,12,28,.55);z-index:50}
.ficha{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:51;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(18,12,28,.25)}
.ficha header{background:var(--n);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;gap:12px}
.ficha header h2{font-size:19px;color:#fff}
.ficha .cuerpo{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.ficha .cerrar{background:none;border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;width:40px;height:40px;cursor:pointer;flex:none}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.hist li{border-left:3px solid var(--l);padding-left:10px}
.modal-fondo{position:fixed;inset:0;background:rgba(18,12,28,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow-y:auto}
.mensaje{background:var(--lf);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--n);color:#fff;padding:12px 18px;border-radius:12px;z-index:70;max-width:90vw}
.perfil-op{display:block;width:100%;text-align:left;border:1px solid var(--b);border-radius:12px;padding:14px;background:#fff;cursor:pointer;margin-top:8px}
.perfil-op:hover{border-color:var(--m);background:var(--l)}
.ingreso{max-width:560px;margin:80px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:0 16px}
.vacio{padding:28px;text-align:center;color:var(--s);background:#fff;border:1px dashed #CFC6DA;border-radius:16px}
@media (max-width: 1000px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lateral{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:10px}
  .lateral .producto,.fase-lat{display:none}
  .navlat{flex-direction:row;overflow-x:auto;order:3;width:100%}
  .navlat button{flex:none;min-height:42px}
  .usuario-lat{margin:0 0 0 auto;border:0;padding:0;display:flex;align-items:center;gap:8px}
  .usuario-lat .rol{display:none}
  .barra-sup{position:static;padding:14px 16px} main{padding:18px 14px 56px}
  .masivo{top:8px}
  input[type=search]{min-width:0;width:100%}
  .barra-sup>div,.filtros-glob{width:100%}
  .filtros-glob label.campo{flex:1 1 100%}
  .filtros-glob select{max-width:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="demo" role="note"><b class="tag">DEMO</b><b>Prototipo con datos de demostración.</b> Estudiantes, celulares y solicitudes ficticios; se guardan solo en este navegador. <a href="app.html">Ver el portal del estudiante</a></div>
<div id="raiz"></div>
<div id="capa"></div>
<div id="modal"></div>

<script src="js/config.js"></script>
<script src="js/datos-prototipo.js"></script>
<script src="js/datos-panel.js"></script>
<script src="js/campana.js"></script>
<script>
(function () {
  const CA = UCP.campana, X = UC_PANEL;
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const titulo = (s) => String(s || '').toLowerCase().replace(/(^|\s)\S/g, (m) => m.toUpperCase());
  const fecha = (iso) => { if (!iso) return 'Por definir'; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
  const soles = (n) => 'S/ ' + Number(n || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const DIAS = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const USUARIOS = [
    { id: 'u1', nombre: 'Ana Torres', correo: 'atorres.demo@continental.edu.pe', rol: 'mesa', rolT: 'Mesa de ayuda' },
    { id: 'u3', nombre: 'Rosa Vega', correo: 'rvega.demo@continental.edu.pe', rol: 'mesa', rolT: 'Mesa de ayuda' },
    { id: 'u4', nombre: 'Miguel Paz', correo: 'mpaz.demo@continental.edu.pe', rol: 'mesa', rolT: 'Mesa de ayuda' },
    { id: 'u2', nombre: 'Carlos Medina', correo: 'cmedina.demo@continental.edu.pe', rol: 'coordinacion', rolT: 'Coordinación académica' }
  ];
  const AGENTES = USUARIOS.filter((u) => u.rol === 'mesa').map((u) => u.nombre);
  const FAC = Object.fromEntries(X.facultades.map((f) => [f.id, f.nombre]));
  const facCorta = (id) => (FAC[id] || '').replace('Facultad de ', '');
  const POR_PAG = 25;
  const ICO = {
    resumen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
    demanda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    estudiantes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5"/></svg>',
    config: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>',
    tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
    ver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
  };

  let U = null, vista = 'resumen';
  let G = JSON.parse(sessionStorage.getItem('uc_panel_filtros') || '{"facultad":"","programa":""}');
  let FE = { rapido: 'todos', curso: '', estado: '', pref: '', ciclo: '', asignado: '', q: '', orden: 'recientes', pagina: 1 };
  let FD = { q: '', semaforo: '', estado: '', orden: 'demanda' };
  let SEL = new Set(), FICHA = null;
  const esCoord = () => U && U.rol === 'coordinacion';
  const toast = (t) => { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3400); };
  const guardarG = () => sessionStorage.setItem('uc_panel_filtros', JSON.stringify(G));

  // ---------------- Datos filtrados ----------------
  const base = () => CA.vigentes().filter((s) => (!G.facultad || CA.facultadDe(s) === G.facultad) && (!G.programa || CA.programaDe(s) === G.programa));
  function demanda(sol) {
    const c = CA.leer(), d = {};
    sol.forEach((s) => s.cursos.forEach((x) => { const r = d[x.codigo] || (d[x.codigo] = { codigo: x.codigo, n: 0, prog: {} }); r.n++; const p = CA.programaDe(s); r.prog[p] = (r.prog[p] || 0) + 1; }));
    return Object.values(d).map((r) => { const cu = CA.curso(r.codigo), min = CA.minimo(c, r.codigo);
      return Object.assign(r, { nombre: cu.nombre, ciclo: cu.ciclo, creditos: cu.creditos, min, sem: r.n >= min ? 'alcanza' : r.n >= min * 0.7 ? 'cerca' : 'lejos', estado: CA.estadoCurso(c, r.codigo), secciones: CA.seccionesCurso(c, r.codigo), publicado: CA.horarioPublicado(c, r.codigo), porFase: c.fase === 'horarios', marcado: !!(c.cursos[r.codigo] && c.cursos[r.codigo].publicado) });
    });
  }
  const SEM = { alcanza: ['Alcanza', 'p-ok', '#145C34'], cerca: ['Cerca', 'p-av', '#9A6700'], lejos: ['Lejos', 'p-er', '#B3261E'] };

  // ---------------- Estructura ----------------
  function ingreso() {
    $('raiz').innerHTML = `<div class="ingreso"><img src="https://adistancia.ucontinental.edu.pe/assets/img/logo.svg" alt="Universidad Continental · Modalidad A Distancia" style="height:44px">
      <h1 style="font-size:28px">Panel de cursos de verano</h1><p class="meta" style="font-size:15px;margin:0">Acceso solo para el equipo autorizado de Coordinación académica y de la mesa de ayuda.</p>
      <button class="btn" id="btn-google">Ingresar con Google (@continental.edu.pe)</button></div>`;
  }
  function selector() {
    $('modal').innerHTML = `<div class="modal-fondo" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal">
      <h2 id="mt" style="font-size:20px">Ingreso de demostración</h2><p class="meta" style="margin:0">En la versión real, el sistema reconoce tu rol por tu cuenta institucional. Elige un usuario de ejemplo:</p>
      ${USUARIOS.map((u) => `<button class="perfil-op" data-usuario="${u.id}"><b>${esc(u.nombre)}</b><br><span class="meta">${esc(u.rolT)}</span></button>`).join('')}
      <div style="text-align:right"><button class="btn-texto" data-cerrar>Cancelar</button></div></div></div>`;
    document.querySelector('.perfil-op').focus();
  }
  function entrar(id) { U = USUARIOS.find((u) => u.id === id); sessionStorage.setItem('uc_proto_panel', id); $('modal').innerHTML = ''; marco(); ir('resumen'); }
  function marco() {
    const c = CA.leer(), F = CA.FASES[c.fase];
    const items = [['resumen', 'Resumen'], ['demanda', 'Demanda por curso'], ['estudiantes', 'Estudiantes'], ...(esCoord() ? [['config', 'Configuración']] : [])];

      <td style="min-width:210px">${f.secciones.map((s, i) => `<div class="meta">${esc(s.seccion)} · ${DIAS[s.dia]} ${esc(s.hora_inicio)}–${esc(s.hora_fin)} ${coord ? `<button class="btn-texto" data-quitar-sec="${f.codigo}" data-i="${i}" aria-label="Quitar la sección ${esc(s.seccion)} de ${esc(f.nombre)}">Quitar</button>` : ''}</div>`).join('') || '<span class="meta">—</span>'}

  // ---------------- Estudiantes ----------------
  function listaEstudiantes() {
    const c = CA.leer();
    const rapidos = {
      todos: () => true,
      pendientes: (s) => s.seguimiento.estado === 'pendiente',
      whatsapp: (s) => s.contacto.preferencia === 'whatsapp',
      abierto: (s) => s.cursos.some((x) => CA.estadoCurso(c, x.codigo) === 'abierto'),
      mios: (s) => s.seguimiento.asignado === U.nombre,
      sinasignar: (s) => !s.seguimiento.asignado
    };
    const b = base();
    const conteo = Object.fromEntries(Object.keys(rapidos).map((k) => [k, b.filter(rapidos[k]).length]));
    let sol = b.filter(rapidos[FE.rapido]);
    if (FE.curso) sol = sol.filter((s) => s.cursos.some((x) => x.codigo === FE.curso));
    if (FE.estado) sol = sol.filter((s) => s.seguimiento.estado === FE.estado);
    if (FE.pref) sol = sol.filter((s) => s.contacto.preferencia === FE.pref);
    if (FE.ciclo) sol = sol.filter((s) => String(s.estudiante.ciclo) === FE.ciclo);
    if (FE.asignado) sol = sol.filter((s) => (FE.asignado === '—' ? !s.seguimiento.asignado : s.seguimiento.asignado === FE.asignado));
    if (FE.q) { const q = FE.q.toLowerCase(); sol = sol.filter((s) => (s.estudiante.nombres + ' ' + s.estudiante.apellidos + ' ' + s.estudiante.correo + ' ' + s.id + ' ' + (s.contacto.celular || '').replace(/\s/g, '')).toLowerCase().includes(q.replace(/\s/g, q.includes('@') ? ' ' : ''))); }
    const ord = { recientes: (a, b2) => b2.fecha.localeCompare(a.fecha), antiguos: (a, b2) => a.fecha.localeCompare(b2.fecha), nombre: (a, b2) => (a.estudiante.apellidos).localeCompare(b2.estudiante.apellidos), ciclo: (a, b2) => b2.estudiante.ciclo - a.estudiante.ciclo }[FE.orden];
    return { sol: sol.sort(ord), conteo, b };
  }

    const todosPag = pag.length && pag.every((s) => SEL.has(s.id));
    const fila = (s) => {

        <td><input type="checkbox" data-sel="${s.id}" ${SEL.has(s.id) ? 'checked' : ''} aria-label="Seleccionar a ${esc(titulo(e.nombres + ' ' + e.apellidos))}" style="width:20px;height:20px;accent-color:#6A00BE"></td>

        <td style="min-width:130px"><b>${esc(CA.PREFERENCIAS[s.contacto.preferencia])}</b><div class="meta">${esc(s.contacto.celular || 'sin celular')}</div></td>

        <td style="min-width:110px">${seg.asignado ? esc(seg.asignado) : '<span class="meta">Sin asignar</span>'}</td>
        <td><div class="acciones" style="flex-wrap:nowrap">
          <button class="icono-btn wa" data-contactar="${s.id}" data-canal="whatsapp" aria-label="WhatsApp a ${n}" title="WhatsApp">${ICO.wa}</button>
          <button class="icono-btn" data-contactar="${s.id}" data-canal="llamada" aria-label="Llamar a ${n}" title="Llamar">${ICO.tel}</button>
          <button class="icono-btn" data-contactar="${s.id}" data-canal="correo" aria-label="Correo a ${n}" title="Correo">${ICO.mail}</button>
          <button class="icono-btn" data-ficha="${s.id}" aria-label="Ver ficha de ${n}" title="Ver ficha">${ICO.ver}</button></div></td></tr>`;
    };
    const pags = [];
    for (let i = 1; i <= paginas; i++) if (i === 1 || i === paginas || Math.abs(i - FE.pagina) <= 2) pags.push(i); else if (pags.at(-1) !== '…') pags.push('…');
    $('main').innerHTML = `
      <div class="chips" role="group" aria-label="Filtros rápidos" style="margin-bottom:14px">${rap.map(([k, t]) => `<button class="chip" data-rapido="${k}" aria-pressed="${FE.rapido === k}">${t}<span>${conteo[k]}</span></button>`).join('')}</div>
      <div class="herramientas"><div class="acciones" style="align-items:flex-end;gap:10px">
        <label class="campo" style="flex:1 1 260px">Buscar<input type="search" id="e-q" value="${esc(FE.q)}" placeholder="Nombre, correo, celular o n.° de solicitud"></label>
        <label class="campo">Curso<select id="e-curso" style="max-width:240px"><option value="">Todos</option>${cursosB.map((f) => `<option value="${f.codigo}" ${f.codigo === FE.curso ? 'selected' : ''}>${esc(f.nombre)} (${f.n})</option>`).join('')}</select></label>
        <label class="campo">Seguimiento<select id="e-estado"><option value="">Todos</option>${opc(CA.SEGUIMIENTO, FE.estado)}</select></label>
        <label class="campo">Prefiere<select id="e-pref"><option value="">Todos</option>${opc(CA.PREFERENCIAS, FE.pref)}</select></label>

  // Mensajes y contacto
  function mensajes(s) {
    const c = CA.leer(), nombre = titulo(s.estudiante.nombres.split(' ')[0]), lista = s.cursos.map((x) => x.nombre).join(', ');
    const conHorario = s.cursos.filter((x) => CA.horarioPublicado(c, x.codigo)).map((x) => x.nombre);
    const noAb = s.cursos.filter((x) => CA.estadoCurso(c, x.codigo) === 'no_abierto').map((x) => x.nombre);
    let cuerpo;
    if (conHorario.length) cuerpo = `¡Buenas noticias! Se abrió ${conHorario.join(', ')} para el verano 2027 y ya tiene horario. Ingresa al portal de cursos de verano para elegir tu sección y luego matricúlate en la intranet del ${fecha(c.matInicio)} al ${fecha(c.matFin)}.${noAb.length ? ` ${noAb.join(', ')} no alcanzó el mínimo de estudiantes; podemos orientarte sobre alternativas.` : ''}`;
    else if (noAb.length && noAb.length === s.cursos.length) cuerpo = `Te escribimos por tu solicitud de ${noAb.join(', ')}. Lamentablemente no alcanzó el mínimo de estudiantes para abrirse en el verano 2027. Podemos orientarte sobre otras opciones para avanzar en tu carrera.`;
    else cuerpo = `Recibimos tu solicitud de apertura de ${lista} para el verano 2027. Te escribimos para orientarte: los horarios se publicarán el ${fecha(c.horarios)} y la matrícula se realiza en la intranet. ¿Tienes alguna consulta?`;
    return { texto: `Hola, ${nombre}. Te saluda ${U.nombre}, de la mesa de ayuda de la Universidad Continental (Modalidad A Distancia). ${cuerpo}`, asunto: `Tu solicitud de cursos de verano 2027 · ${s.id}` };
  }
  function contactar(id, canal) {
    const s = CA.vigentes().find((x) => x.id === id), m = mensajes(s), cel = s.contacto.celular || '', num = cel.replace(/\D/g, ''), proto = UCP.config.modo === 'prototipo';
    const enlace = canal === 'whatsapp' ? (proto ? `https://wa.me/?text=${encodeURIComponent(m.texto)}` : `https://wa.me/${num}?text=${encodeURIComponent(m.texto)}`) : canal === 'llamada' ? `tel:+${num}` : `mailto:${s.estudiante.correo}?subject=${encodeURIComponent(m.asunto)}&body=${encodeURIComponent(m.texto)}`;
    const T = { whatsapp: 'WhatsApp', llamada: 'Llamada', correo: 'Correo' }[canal];
    $('modal').innerHTML = `<div class="modal-fondo" role="dialog" aria-modal="true" aria-labelledby="mc"><div class="modal">
      <h2 id="mc" style="font-size:20px">${T} a ${esc(titulo(s.estudiante.nombres + ' ' + s.estudiante.apellidos))}</h2>
      <p class="meta" style="margin:0">${canal === 'correo' ? esc(s.estudiante.correo) : esc(cel || 'Sin celular registrado')} · Prefiere: ${esc(CA.PREFERENCIAS[s.contacto.preferencia])}</p>
      ${canal !== 'llamada' ? `<div class="mensaje">${esc(m.texto)}</div>` : '<p style="margin:0">Guion sugerido: confirma su solicitud, explica que los horarios se publican al cierre, comenta el costo estimado y recuerda que la matrícula se hace en la intranet.</p>'}
      ${proto ? `<p class="pill p-av" style="white-space:normal;margin:0">Prototipo: el celular es ficticio, así que ${canal === 'whatsapp' ? 'WhatsApp se abrirá sin destinatario para que veas el mensaje. En el piloto se abrirá directamente el chat del estudiante.' : canal === 'llamada' ? 'no se inicia la llamada. En el piloto, el botón llamará al estudiante.' : 'el correo es de ejemplo.'}</p>` : ''}
      <label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="marcar" checked style="width:20px;height:20px;accent-color:#6A00BE"> Marcar como contactado y registrar en el historial</label>
      <div class="acciones">${canal === 'llamada' && proto ? '' : `<a class="btn ${canal === 'whatsapp' ? 'wa' : ''}" href="${esc(enlace)}" target="_blank" rel="noopener" data-registrar="${s.id}" data-canal="${canal}">${canal === 'whatsapp' ? 'Abrir WhatsApp' : canal === 'llamada' ? 'Llamar' : 'Abrir correo'}</a>`}
        ${canal !== 'llamada' ? '<button class="btn sec" data-copiar>Copiar mensaje</button>' : ''}
        <button class="btn sec" data-registrar="${s.id}" data-canal="${canal}" data-solo-registro>Solo registrar</button><button class="btn-texto" data-cerrar>Cerrar</button></div></div></div>`;
    $('modal').dataset.texto = m.texto;
  }
  function registrar(id, canal) {
    if ($('marcar') && $('marcar').checked) { const s = CA.vigentes().find((x) => x.id === id); CA.actualizarSeguimiento(id, s.seguimiento.estado === 'pendiente' ? { estado: 'contactado' } : {}, `${U.nombre} (${U.rolT})`, `Contacto por ${CA.PREFERENCIAS[canal]}`); }
    $('modal').innerHTML = ''; refrescar(); toast('Contacto registrado en el historial.');
  }
  function exportar(ids) {
    const c = CA.leer(), set = ids ? new Set(ids) : null;
    const sol = set ? CA.vigentes().filter((s) => set.has(s.id)) : listaEstudiantes().sol;
    const filas = [['Solicitud', 'Fecha', 'Facultad', 'Programa', 'Ciclo', 'Nombres', 'Apellidos', 'Correo', 'Celular', 'Prefiere', 'Curso', 'Código', 'Créditos', 'Sección', 'Estado del curso', 'Seguimiento', 'Asignado', 'Notas']];
    sol.forEach((s) => s.cursos.forEach((x) => filas.push([s.id, fecha(s.fecha), FAC[CA.facultadDe(s)] || '', CA.programaDe(s), s.estudiante.ciclo, s.estudiante.nombres, s.estudiante.apellidos, s.estudiante.correo, s.contacto.celular, CA.PREFERENCIAS[s.contacto.preferencia], x.nombre, x.codigo, x.creditos, x.seccion || '', CA.ESTADOS_CURSO[CA.estadoCurso(c, x.codigo)], CA.SEGUIMIENTO[s.seguimiento.estado], s.seguimiento.asignado || '', s.seguimiento.notas || ''])));
    const csv = '\ufeff' + filas.map((f) => f.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `solicitudes-verano-2027${G.programa ? '-' + G.programa.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-') : ''}.csv`; a.click();

      <section class="tarjeta"><h2>Reglas</h2><div class="grid" style="gap:12px">

        <p class="meta" style="margin:0">Máximo por verano: 11 créditos.</p></div></section>

        <p class="meta">En el piloto, los roles se asignan por cuenta institucional.</p>
        <div class="acciones"><button class="btn sec chico" id="sincronizar">Simular datos de matrícula de TI</button><button class="btn-texto" id="reiniciar" style="color:#7A2419">Restablecer datos de demostración</button></div></section>
      </div>
      <div style="margin-top:16px"><button class="btn" id="guardar-config">Guardar configuración</button></div>`;
  }
  function guardarConfig() {
    const c = CA.leer();
    c.fase = $('c-fase').value; ['inicio', 'cierre', 'horarios', 'matInicio', 'matFin'].forEach((k) => { c[k] = $('c-' + k).value || c[k]; });
    c.minimoDefecto = Math.max(1, +$('c-minimo').value || 15); c.carga = +$('c-carga').value || null;
    const n = +$('c-cuotas').value || 3;
    c.costos = { credito: Math.max(0, +$('c-credito').value || 0), matricula: Math.max(0, +$('c-matricula').value || 0), cuotas: n, venceMatricula: $('c-vm').value || c.costos.venceMatricula, venceCuotas: [0, 1, 2, 3].slice(0, n).map((i) => $('c-vc' + i).value || (c.costos.venceCuotas || [])[i] || null) };
    CA.guardar(c); marco(); ir('config'); toast('Configuración guardada. El portal del estudiante ya usa estos valores.');
  }
  function sincronizar() {
    const c = CA.leer(); let n = 0;
    CA.vigentes().forEach((s) => { if (s.seguimiento.estado === 'orientado' && s.cursos.some((x) => CA.estadoCurso(c, x.codigo) === 'abierto')) { CA.actualizarSeguimiento(s.id, { estado: 'matriculado' }, 'Intranet (TI)', 'Matrícula confirmada por la intranet'); n++; } });
    toast(n ? `${n} ${n === 1 ? 'estudiante marcado' : 'estudiantes marcados'} como matriculados.` : 'No hay estudiantes orientados con cursos abiertos todavía.');
  }
  const refrescar = () => { ({ resumen: vResumen, demanda: vDemanda, estudiantes: vEstudiantes, config: vConfig })[vista](); if (FICHA) abrirFicha(FICHA); };

  // ---------------- Eventos ----------------
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, a, [data-cerrar-ficha]'); if (!b) return;
    const d = b.dataset;
    if (b.id === 'btn-google') selector();
    else if (d.usuario) entrar(d.usuario);
    else if (b.hasAttribute('data-cerrar')) $('modal').innerHTML = '';
    else if (b.hasAttribute('data-cerrar-ficha')) cerrarFicha();
    else if (b.id === 'btn-salir') { sessionStorage.removeItem('uc_proto_panel'); U = null; cerrarFicha(); ingreso(); }
    else if (d.vista) ir(d.vista);
    else if (b.id === 'g-limpiar') { G = { facultad: '', programa: '' }; guardarG(); FE.pagina = 1; refrescar(); }
    else if (d.filtrarFac) { G = { facultad: d.filtrarFac, programa: '' }; guardarG(); vResumen(); }
    else if (d.filtrarProg) { const p = X.programas.find((x) => x.nombre === d.filtrarProg); G = { facultad: p ? p.facultad : '', programa: d.filtrarProg }; guardarG(); vResumen(); }
    else if (d.fd) { FD[d.fd] = d.val; vDemanda(); }
    else if (d.verEstudiantes) { FE = Object.assign(FE, { rapido: 'todos', curso: d.verEstudiantes, estado: '', pref: '', ciclo: '', asignado: '', q: '', pagina: 1 }); ir('estudiantes'); }
    else if (d.rapido) { FE.rapido = d.rapido; FE.pagina = 1; vEstudiantes(); }
    else if (d.pag) { FE.pagina = +d.pag; vEstudiantes(); $('main').scrollIntoView(); }
    else if (d.contactar) contactar(d.contactar, d.canal);
    else if (d.ficha) abrirFicha(d.ficha);
    else if (d.registrar) { if (b.hasAttribute('data-solo-registro')) e.preventDefault(); registrar(d.registrar, d.canal); }
    else if (b.hasAttribute('data-copiar')) { try { navigator.clipboard.writeText($('modal').dataset.texto); } catch (x) {} toast('Mensaje copiado.'); }
    else if (b.id === 'exportar') exportar();
    else if (d.masivo) {
      const ids = [...SEL], quien = `${U.nombre} (${U.rolT})`;
      if (d.masivo === 'limpiar') SEL = new Set();
      else if (d.masivo === 'exportar') exportar(ids);
      else if (d.masivo === 'asignarme') { CA.actualizarVarios(ids, { asignado: U.nombre }, quien, `Asignado a ${U.nombre}`); toast(`${ids.length} asignados a ti.`); SEL = new Set(); }
      else if (d.masivo === 'asignar') { const a = $('m-agente').value; if (!a) { toast('Elige a quién asignar.'); return; } CA.actualizarVarios(ids, { asignado: a }, quien, `Asignado a ${a}`); toast(`${ids.length} asignados a ${a}.`); SEL = new Set(); }
      else if (d.masivo === 'contactado') { CA.actualizarVarios(ids, { estado: 'contactado' }, quien, 'Seguimiento: Contactado (acción masiva)'); toast(`${ids.length} marcados como contactados.`); SEL = new Set(); }
      vEstudiantes();
    }
    else if (b.id === 'guardar-config') guardarConfig();
    else if (b.id === 'sincronizar') sincronizar();
    else if (b.id === 'reiniciar') { if (confirm('¿Restablecer todas las solicitudes y la configuración de la demostración?')) { CA.reiniciar(); CA.solicitudes(); marco(); ir('resumen'); toast('Datos de demostración restablecidos.'); } }
    else if (d.agregarSec) {
      const k = d.agregarSec, c = CA.leer(), secs = CA.seccionesCurso(c, k).slice();
      const ini = document.querySelector(`[data-nueva-ini="${k}"]`).value, fin = document.querySelector(`[data-nueva-fin="${k}"]`).value;
      if (!ini || !fin || fin <= ini) { toast('Revisa la hora de inicio y de fin.'); return; }

      CA.guardarSecciones(k, secs); vDemanda(); toast('Sección agregada.');
    }
    else if (d.quitarSec) { const k = d.quitarSec, c = CA.leer(), secs = CA.seccionesCurso(c, k).slice(); secs.splice(+d.i, 1); secs.forEach((s, i) => { s.seccion = 'V-' + String(i + 1).padStart(2, '0'); }); CA.guardarSecciones(k, secs); vDemanda(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target, d = t.dataset, quien = U ? `${U.nombre} (${U.rolT})` : '';
    if (t.id === 'g-facultad') { G = { facultad: t.value, programa: '' }; guardarG(); FE.pagina = 1; FE.curso = ''; refrescar(); }
    else if (t.id === 'g-programa') { const p = X.programas.find((x) => x.nombre === t.value); G = { facultad: p ? p.facultad : G.facultad, programa: t.value }; guardarG(); FE.pagina = 1; FE.curso = ''; refrescar(); }
    else if (t.id === 'd-orden') { FD.orden = t.value; vDemanda(); }
    else if (['e-curso', 'e-estado', 'e-pref', 'e-ciclo', 'e-asignado', 'e-orden'].includes(t.id)) { FE[t.id.slice(2)] = t.value; FE.pagina = 1; vEstudiantes(); }
    else if (d.sel) { if (t.checked) SEL.add(d.sel); else SEL.delete(d.sel); vEstudiantes(); }
    else if (t.id === 'sel-pagina') { const { sol } = listaEstudiantes(), pag = sol.slice((FE.pagina - 1) * POR_PAG, FE.pagina * POR_PAG); pag.forEach((s) => (t.checked ? SEL.add(s.id) : SEL.delete(s.id))); vEstudiantes(); }
    else if (d.minimo) { const c = CA.leer(); c.minimos[d.minimo] = Math.max(1, +t.value || 1); CA.guardar(c); vDemanda(); }
    else if (d.publicar) { const n = CA.publicarHorario(d.publicar, t.checked); vDemanda(); if (n < 0) toast('Primero abre el curso y carga al menos una sección.'); else toast(t.checked ? `Horario publicado. Se registró el correo automático a ${n} ${n === 1 ? 'estudiante' : 'estudiantes'}.` : 'El horario dejó de mostrarse a los estudiantes.'); }
    else if (d.estado) { const n = CA.decidirCurso(d.estado, t.value, null, U.nombre); vDemanda(); if (t.value !== 'por_decidir') toast(`Curso marcado como ${CA.ESTADOS_CURSO[t.value].toLowerCase()}. Se registró el correo automático a ${n} ${n === 1 ? 'estudiante' : 'estudiantes'}.`); }
    else if (d.seguimiento) { CA.actualizarSeguimiento(d.seguimiento, { estado: t.value }, quien, `Seguimiento: ${CA.SEGUIMIENTO[t.value]}`); toast('Seguimiento actualizado.'); refrescar(); }
    else if (d.asignar) { CA.actualizarSeguimiento(d.asignar, { asignado: t.value || null }, quien, t.value ? `Asignado a ${t.value}` : 'Sin asignar'); toast('Asignación actualizada.'); refrescar(); }
    else if (d.notas !== undefined) { CA.actualizarSeguimiento(d.notas, { notas: t.value }, quien, 'Notas actualizadas'); toast('Notas guardadas.'); }
    else if (t.id === 'c-cuotas') { const n = +t.value; [0, 1, 2, 3].forEach((i) => $('c-vc' + i).closest('label').classList.toggle('oculto', i >= n)); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target; if (t.id !== 'e-q' && t.id !== 'd-q') return;
    clearTimeout(window._q); window._q = setTimeout(() => { if (t.id === 'e-q') { FE.q = t.value; FE.pagina = 1; vEstudiantes(); } else { FD.q = t.value; vDemanda(); } const q = $(t.id); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 300);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('modal').innerHTML) $('modal').innerHTML = ''; else if (FICHA) cerrarFicha(); } });

  CA.solicitudes();
  const previo = sessionStorage.getItem('uc_proto_panel');
  if (previo && USUARIOS.some((u) => u.id === previo)) entrar(previo); else ingreso();
})();
</script>
